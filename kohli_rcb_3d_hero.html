
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { background: #000; overflow: hidden; }
  #c { display: block; width: 100%; height: 520px; }
  .hero-wrap {
    position: relative;
    width: 100%;
    height: 520px;
    background: #000;
    overflow: hidden;
    font-family: var(--font-sans, sans-serif);
  }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 40px;
    pointer-events: none;
    z-index: 10;
  }
  .tag { font-size: 11px; letter-spacing: 3px; color: #FFD700; text-transform: uppercase; margin-bottom: 10px; opacity: 0.85; }
  .title-red { font-size: 52px; font-weight: 900; color: #E32636; line-height: 1; text-transform: uppercase; text-shadow: 0 0 40px rgba(227,38,54,0.6); }
  .title-gold { font-size: 52px; font-weight: 900; color: #FFD700; line-height: 1; text-transform: uppercase; text-shadow: 0 0 40px rgba(255,215,0,0.5); }
  .subtitle { font-size: 13px; color: rgba(255,255,255,0.65); max-width: 340px; margin-top: 14px; line-height: 1.6; }
  .btn-row { display: flex; gap: 12px; margin-top: 24px; pointer-events: all; }
  .btn-red {
    background: #E32636; color: #fff; border: none;
    padding: 10px 22px; font-size: 13px; font-weight: 600;
    border-radius: 4px; cursor: pointer; letter-spacing: 0.5px;
  }
  .btn-outline {
    background: transparent; color: #fff;
    border: 1.5px solid rgba(255,255,255,0.5);
    padding: 10px 22px; font-size: 13px; font-weight: 600;
    border-radius: 4px; cursor: pointer;
  }
  .scroll-hint {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.4); font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase; z-index: 10; text-align: center;
  }
  .scroll-arrow { display: block; margin: 4px auto 0; width: 16px; height: 16px;
    border-right: 1.5px solid rgba(255,255,255,0.35); border-bottom: 1.5px solid rgba(255,255,255,0.35);
    transform: rotate(45deg); }
  .rcb-badge {
    position: absolute; top: 20px; right: 24px; z-index: 10;
    font-size: 10px; letter-spacing: 2px; color: #FFD700; text-transform: uppercase; opacity: 0.7;
  }
  .king-badge {
    position: absolute; right: 24px; bottom: 60px; z-index: 10; text-align: right;
  }
  .king-badge .name { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 1px; }
  .king-badge .year { font-size: 11px; color: #FFD700; letter-spacing: 2px; opacity: 0.8; }
</style>

<div class="hero-wrap">
  <canvas id="c"></canvas>

  <div class="rcb-badge">RCB Official</div>

  <div class="overlay">
    <div class="tag">The King's Legacy</div>
    <div class="title-red">Virat Kohli</div>
    <div class="title-gold">Legacy</div>
    <div class="subtitle">Statistics, historic records, and iconic battle moments of the ultimate modern legend. Designed in the bold Red &amp; Black RCB theme.</div>
    <div class="btn-row">
      <button class="btn-red">Explore Stats</button>
      <button class="btn-outline">Explore Jerseys</button>
    </div>
  </div>

  <div class="king-badge">
    <div class="name">King Kohli</div>
    <div class="year">2026 Season</div>
  </div>

  <div class="scroll-hint">
    Scroll to Discover
    <span class="scroll-arrow"></span>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resize();
window.addEventListener('resize', resize);

const W = () => canvas.width;
const H = () => canvas.height;

// Particles
const particles = [];
const COLORS = ['#E32636','#FFD700','#CC2030','#FFC200','#FF4444','#FFE566'];
for (let i = 0; i < 320; i++) {
  particles.push({
    x: Math.random(),
    y: Math.random(),
    z: Math.random() * 2 + 0.3,
    size: Math.random() * 3.5 + 1,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    vx: (Math.random() - 0.5) * 0.0003,
    vy: (Math.random() - 0.5) * 0.0003,
    shape: Math.random() > 0.5 ? 'square' : 'square',
    alpha: Math.random() * 0.5 + 0.4,
  });
}

// Orbital rings — 3D perspective
const rings = [
  { rx: 0.36, ry: 0.11, cx: 0.55, cy: 0.48, tilt: 0.22, speed: 0.003, color: '#8B1010', lw: 1.2, phase: 0 },
  { rx: 0.28, ry: 0.08, cx: 0.52, cy: 0.50, tilt: -0.15, speed: -0.002, color: '#6B6B00', lw: 0.9, phase: 1.2 },
  { rx: 0.20, ry: 0.065, cx: 0.53, cy: 0.47, tilt: 0.38, speed: 0.0045, color: '#333', lw: 0.8, phase: 2.4 },
];

// Glowing orb at center
const orb = { cx: 0.54, cy: 0.49 };

let t = 0;
function draw() {
  const w = W(), h = H();
  ctx.clearRect(0, 0, w, h);

  // Deep dark bg
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, w, h);

  // Subtle red vignette
  const vg = ctx.createRadialGradient(w * 0.54, h * 0.5, h * 0.05, w * 0.54, h * 0.5, h * 0.85);
  vg.addColorStop(0, 'rgba(80,0,0,0.0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.82)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, w, h);

  // 3D glowing orb
  const ox = orb.cx * w, oy = orb.cy * h;
  const orbR = Math.min(w, h) * 0.18;
  const orbG = ctx.createRadialGradient(ox - orbR * 0.2, oy - orbR * 0.15, orbR * 0.05, ox, oy, orbR);
  orbG.addColorStop(0, 'rgba(160,10,10,0.85)');
  orbG.addColorStop(0.45, 'rgba(100,5,5,0.6)');
  orbG.addColorStop(0.78, 'rgba(50,0,0,0.3)');
  orbG.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(ox, oy, orbR, 0, Math.PI * 2);
  ctx.fillStyle = orbG;
  ctx.fill();

  // Particles (behind rings partially)
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < -0.05) p.x = 1.05;
    if (p.x > 1.05) p.x = -0.05;
    if (p.y < -0.05) p.y = 1.05;
    if (p.y > 1.05) p.y = -0.05;

    const px = p.x * w, py = p.y * h;
    const sz = p.size * p.z * (w / 700);
    ctx.globalAlpha = p.alpha * 0.85;
    ctx.fillStyle = p.color;
    ctx.fillRect(px - sz / 2, py - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;

  // 3D elliptical orbital rings
  for (const ring of rings) {
    ring.phase += ring.speed;
    const cx = ring.cx * w, cy = ring.cy * h;
    const rx = ring.rx * w, ry = ring.ry * h;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ring.tilt);

    // Draw ellipse ring with perspective depth
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.strokeStyle = ring.color;
    ctx.lineWidth = ring.lw;
    ctx.globalAlpha = 0.75;
    ctx.stroke();

    // Small orbiting dot on the ring
    const dotAngle = ring.phase;
    const dx = Math.cos(dotAngle) * rx;
    const dy = Math.sin(dotAngle) * ry;
    ctx.beginPath();
    ctx.arc(dx, dy, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = ring.color === '#8B1010' ? '#E32636' : '#FFD700';
    ctx.globalAlpha = 0.9;
    ctx.fill();

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // Highlight flare at top of orb
  ctx.beginPath();
  ctx.ellipse(ox - orbR * 0.18, oy - orbR * 0.28, orbR * 0.22, orbR * 0.1, -0.4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,220,220,0.1)';
  ctx.fill();

  t += 0.008;
  requestAnimationFrame(draw);
}
draw();
</script>
